<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Quiz</title>
    <style>
        .container { text-align: center; margin-top: 20px; }
        img { width: 100px; height: 100px; display: block; margin: 10px auto; }
        input, button { margin-top: 10px; padding: 5px; }
    </style>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 50px;
        }
    
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
    
        img {
            width: 120px;
            height: 120px;
            margin: 10px auto;
            display: block;
            border-radius: 10px;
            border: 2px solid #ddd;
        }
    
        input {
            width: 200px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
    
        input:focus {
            border-color: #3498db;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.5);
        }
    
        button {
            background: linear-gradient(135deg, #3498db, #1e88e5);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
        }
    
        button:hover {
            background: linear-gradient(135deg, #1e88e5, #1565c0);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
    
        #score {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-top: 15px;
        }
    </style>
    
</head>
<body>
    <div class="container">
        <button onclick="shufflePairs()">Đảo lộn danh sách</button>
        <div id="quiz-container">
            <img id="image" src="" alt="quiz">
            <input type="text" id="answer" placeholder="Nhập đáp án">
            <button onclick="checkAnswer()">Kiểm tra</button>
            <p id="score">Đúng: 0 / 0 | Sai: 0</p>
        </div>
    </div>

    <script>
        let pairs = [
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Hiragana_letter_A.svg/800px-Hiragana_letter_A.svg.png", value: "a" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Hiragana_letter_I.svg/800px-Hiragana_letter_I.svg.png", value: "i" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/Hiragana_letter_U.svg/800px-Hiragana_letter_U.svg.png", value: "u" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/74/Hiragana_letter_E.svg/800px-Hiragana_letter_E.svg.png", value: "e" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Hiragana_letter_O.svg/800px-Hiragana_letter_O.svg.png", value: "o" },
            
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f0/Hiragana_letter_Ka.svg/800px-Hiragana_letter_Ka.svg.png", value: "ka" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/Hiragana_letter_Ki.svg/800px-Hiragana_letter_Ki.svg.png", value: "ki" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Hiragana_letter_Ku.svg/800px-Hiragana_letter_Ku.svg.png", value: "ku" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/Hiragana_letter_Ke.svg/800px-Hiragana_letter_Ke.svg.png", value: "ke" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Hiragana_letter_Ko.svg/800px-Hiragana_letter_Ko.svg.png", value: "ko" },
            
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Hiragana_letter_Sa.svg/800px-Hiragana_letter_Sa.svg.png", value: "sa" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Hiragana_letter_Si.svg/800px-Hiragana_letter_Si.svg.png", value: "shi" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Hiragana_letter_Su.svg/800px-Hiragana_letter_Su.svg.png", value: "su" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Hiragana_letter_Se.svg/800px-Hiragana_letter_Se.svg.png", value: "se" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Hiragana_letter_So.svg/800px-Hiragana_letter_So.svg.png", value: "so" },
            
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Hiragana_letter_Ta.svg/800px-Hiragana_letter_Ta.svg.png", value: "ta" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Hiragana_letter_Ti.svg/800px-Hiragana_letter_Ti.svg.png", value: "chi" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Hiragana_letter_Tu.svg/800px-Hiragana_letter_Tu.svg.png", value: "tsu" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Hiragana_letter_Te.svg/800px-Hiragana_letter_Te.svg.png", value: "te" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Hiragana_letter_To.svg/800px-Hiragana_letter_To.svg.png", value: "to" },

            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/Hiragana_letter_Na.svg/800px-Hiragana_letter_Na.svg.png", value: "na" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Hiragana_letter_Ni.svg/800px-Hiragana_letter_Ni.svg.png", value: "ni" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Hiragana_letter_Nu.svg/800px-Hiragana_letter_Nu.svg.png", value: "nu" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Hiragana_letter_Ne.svg/800px-Hiragana_letter_Ne.svg.png", value: "ne" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/Hiragana_letter_No.svg/800px-Hiragana_letter_No.svg.png", value: "no" },

            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Hiragana_letter_Ha.svg/800px-Hiragana_letter_Ha.svg.png", value: "ha" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Hiragana_letter_Hi.svg/800px-Hiragana_letter_Hi.svg.png", value: "hi" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Hiragana_letter_Hu.svg/800px-Hiragana_letter_Hu.svg.png", value: "fu" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Hiragana_letter_He.svg/800px-Hiragana_letter_He.svg.png", value: "he" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/Hiragana_letter_Ho.svg/800px-Hiragana_letter_Ho.svg.png", value: "ho" },

            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Hiragana_letter_Ma.svg/800px-Hiragana_letter_Ma.svg.png", value: "ma" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/Hiragana_letter_Mi.svg/800px-Hiragana_letter_Mi.svg.png", value: "mi" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/bf/Hiragana_letter_Mu.svg/800px-Hiragana_letter_Mu.svg.png", value: "mu" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Hiragana_letter_Me.svg/800px-Hiragana_letter_Me.svg.png", value: "me" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b0/Hiragana_letter_Mo.svg/800px-Hiragana_letter_Mo.svg.png", value: "mo" },

            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Hiragana_letter_Ya.svg/800px-Hiragana_letter_Ya.svg.png", value: "ya" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/Hiragana_letter_Yu.svg/800px-Hiragana_letter_Yu.svg.png", value: "yu" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Hiragana_letter_Yo.svg/800px-Hiragana_letter_Yo.svg.png", value: "yo" },

            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/71/Hiragana_letter_Ra.svg/800px-Hiragana_letter_Ra.svg.png", value: "ra" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7f/Hiragana_letter_Ri.svg/800px-Hiragana_letter_Ri.svg.png", value: "ri" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Hiragana_letter_Ru.svg/800px-Hiragana_letter_Ru.svg.png", value: "ru" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Hiragana_letter_Re.svg/800px-Hiragana_letter_Re.svg.png", value: "re" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Hiragana_letter_Ro.svg/800px-Hiragana_letter_Ro.svg.png", value: "ro" },

            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Hiragana_letter_Wa.svg/800px-Hiragana_letter_Wa.svg.png", value: "wa" },
            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Hiragana_letter_Wo.svg/800px-Hiragana_letter_Wo.svg.png", value: "wo" },

            { key: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/Hiragana_letter_N.svg/800px-Hiragana_letter_N.svg.png", value: "n" }
        ];

        let currentIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;

        function shufflePairs() {
            pairs = pairs.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            loadImage();
            updateScore();
        }

        function loadImage() {
            document.getElementById("image").src = pairs[currentIndex].key;
            document.getElementById("answer").value = "";
            document.getElementById("answer").focus(); // Đưa con trỏ vào ô nhập
        }

        function checkAnswer() {
            const inputValue = document.getElementById("answer").value.trim().toLowerCase();
            if (inputValue === pairs[currentIndex].value.toLowerCase()) {
                correctCount++;
                if (currentIndex < pairs.length - 1) {
                    currentIndex++;
                    loadImage();
                } else {
                    alert("Chúc mừng! Bạn đã hoàn thành bài tập.");
                }
            } else {
                wrongCount++;
                alert("Sai rồi! Hãy thử lại.");
            }
            updateScore();
        }

        function updateScore() {
            document.getElementById("score").innerText = `Đúng: ${correctCount} / ${pairs.length} | Sai: ${wrongCount}`;
        }

        // Lắng nghe sự kiện nhấn phím Enter trong ô nhập
        document.getElementById("answer").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });

        loadImage(); // Load hình ảnh đầu tiên khi trang mở
    </script>
</body>
</html>
